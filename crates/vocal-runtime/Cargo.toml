[package]
name = "vocal-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
cpu-graph = ["vocal-engine/cpu-graph"]
default = []
tensorrt-rtx = ["vocal-engine/tensorrt-rtx", "dep:vocal-tensorrt"]
directml = ["vocal-engine/directml", "dep:vocal-directml"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
vocal-engine.workspace = true
vocal-model.workspace = true
vocal-types.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
sha2 = "0.10"
fs2 = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
vocal-tensorrt = { path = "../vocal-tensorrt", optional = true }
vocal-directml = { path = "../vocal-directml", optional = true }

[target.'cfg(windows)'.dependencies]
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_LibraryLoader"] }
