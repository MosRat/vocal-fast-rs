[package]
name = "vocal-fast"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
tensorrt-rtx = ["vocal-engine/tensorrt-rtx", "dep:vocal-tensorrt"]

[[bin]]
name = "vocal-fast"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
vocal-audio.workspace = true
vocal-engine.workspace = true
vocal-model.workspace = true
vocal-types.workspace = true
vocal-tensorrt = { path = "../vocal-tensorrt", optional = true }
