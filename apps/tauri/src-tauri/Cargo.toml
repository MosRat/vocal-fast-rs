[package]
name = "vocal-fast-tauri"
version = "0.1.5"
edition = "2024"
publish = false

[workspace]

[features]
cpu-graph = ["vocal-engine/cpu-graph", "vocal-runtime/cpu-graph"]
default = ["directml", "cpu-graph"]
directml = ["vocal-engine/directml", "vocal-runtime/directml"]
tensorrt-rtx = ["vocal-engine/tensorrt-rtx", "vocal-runtime/tensorrt-rtx", "dep:vocal-tensorrt"]

[lib]
name = "vocal_fast_tauri_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vocal-types = { path = "../../../crates/vocal-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tauri = { version = "2", features = ["tray-icon", "devtools"] }
vocal-engine = { path = "../../../crates/vocal-engine" }
vocal-model = { path = "../../../crates/vocal-model" }
vocal-runtime = { path = "../../../crates/vocal-runtime" }
vocal-tensorrt = { path = "../../../crates/vocal-tensorrt", optional = true }
vocal-audio = { path = "../../../crates/vocal-audio", features = ["cpal-backend", "wasapi-backend"] }
cpal = "0.18"

[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
webview2-com = "0.39.1"
windows-core = "0.62"
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6"] }

# This crate is an isolated Cargo workspace, so keep its profiles aligned
# with the root workspace's fast relink and thin-LTO policy.
[profile.dev]
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.dev.package.vocal-model]
opt-level = 2
[profile.dev.package.vocal-cpu]
opt-level = 2
[profile.dev.package.vocal-graph]
opt-level = 2
[profile.dev.package.vocal-directml]
opt-level = 2
[profile.dev.package.vocal-tensorrt]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = "symbols"
debug = false
