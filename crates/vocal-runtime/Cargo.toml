[package]
name = "vocal-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
tensorrt-rtx = ["vocal-engine/tensorrt-rtx", "dep:vocal-tensorrt"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
vocal-engine.workspace = true
vocal-model.workspace = true
vocal-types.workspace = true
vocal-tensorrt = { path = "../vocal-tensorrt", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
