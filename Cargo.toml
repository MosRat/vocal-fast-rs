[workspace]
resolver = "2"
members = [
    "crates/vocal-types",
    "crates/vocal-audio",
    "crates/vocal-model",
    "crates/vocal-engine",
    "crates/vocal-runtime",
    "crates/vocal-tensorrt",
    "crates/vocal-directml",
    "crates/vocal-graph",
    "crates/vocal-cpu",
    "crates/vocal-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
half = "2.6"
mimalloc = { version = "0.1.52", default-features = false }
vocal-types = { path = "crates/vocal-types" }
vocal-audio = { path = "crates/vocal-audio" }
vocal-model = { path = "crates/vocal-model" }
vocal-engine = { path = "crates/vocal-engine" }
vocal-runtime = { path = "crates/vocal-runtime" }

# Development builds prioritize fast relinks and usable backtraces. Release
# builds keep thin LTO for cross-crate inlining without the link cost of fat
# LTO; the audio hot path still gets a single optimized release code path.
[profile.dev]
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1
debug = false

# Model decoding and graph construction traverse hundreds of MiB of numeric
# data. Keep those paths optimized even in an otherwise debuggable GUI/CLI.
[profile.dev.package.vocal-model]
opt-level = 2
[profile.dev.package.vocal-directml]
opt-level = 2
[profile.dev.package.vocal-tensorrt]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = "symbols"
debug = false

[profile.dev.package.vocal-graph]
opt-level = 2
[profile.dev.package.vocal-cpu]
opt-level = 2
