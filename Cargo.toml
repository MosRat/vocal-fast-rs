[workspace]
resolver = "2"
members = [
    "crates/vocal-types",
    "crates/vocal-audio",
    "crates/vocal-model",
    "crates/vocal-engine",
    "crates/vocal-tensorrt",
    "crates/vocal-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://example.invalid/vocal-fast-rs"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
half = "2.6"
vocal-types = { path = "crates/vocal-types" }
vocal-audio = { path = "crates/vocal-audio" }
vocal-model = { path = "crates/vocal-model" }
vocal-engine = { path = "crates/vocal-engine" }
