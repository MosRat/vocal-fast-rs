[project]
name = "vocal-fast-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "torch", "torchvision", "torchaudio"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu130"
explicit = true
