name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the package as a GitHub Release; leave false for a packaging smoke test"
        required: true
        default: false
        type: boolean
      include_tensorrt:
        description: "Download and build the TensorRT-RTX package on GitHub-hosted runners"
        required: true
        default: false
        type: boolean
      tensorrt_url:
        description: "Authorized TensorRT-RTX archive URL; blank uses repository variable"
        required: false
        default: ""
        type: string
      tensorrt_sha256:
        description: "SHA-256 for the TensorRT-RTX archive; blank uses repository variable"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Verify release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$REF_NAME" == v*.*.* ]] || { echo "invalid release tag: $REF_NAME" >&2; exit 1; }
            version="${REF_NAME#v}"
            tag="$REF_NAME"
          else
            version="$(python scripts/release-version.py read)"
            tag="v$version"
          fi
          python scripts/release-version.py verify --expected "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    name: Windows ${{ matrix.backend }} package
    needs: metadata
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - Cpu
          - DirectMl
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up frontend dependencies
        working-directory: apps/tauri
        run: npm ci

      - name: Verify tag and manifest version
        shell: pwsh
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          $version = $env:TAG.Substring(1)
          python scripts/release-version.py verify --expected $version

      - name: Build Windows release
        shell: pwsh
        env:
          CARGO_TERM_COLOR: always
        run: |
          $target = Join-Path $env:RUNNER_TEMP "vocal-fast-${{ matrix.backend }}"
          pwsh -NoProfile -File scripts/build-windows.ps1 `
            -Profile Release `
            -Backend "${{ matrix.backend }}" `
            -TargetDirectory $target

      - name: Collect installer and build manifest
        shell: pwsh
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          BACKEND: ${{ matrix.backend }}
        run: |
          $target = Join-Path $env:RUNNER_TEMP "vocal-fast-$env:BACKEND"
          $destination = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $installer = Get-ChildItem (Join-Path $target "release/bundle/nsis") -Filter "*-setup.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          Copy-Item $installer.FullName (Join-Path $destination "vocal-fast-$env:TAG-$env:BACKEND-setup.exe")
          Copy-Item (Join-Path $target "windows-build/Release-$env:BACKEND/artifacts.json") (Join-Path $destination "vocal-fast-$env:TAG-$env:BACKEND-artifacts.json")

      - name: Upload package artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-${{ matrix.backend }}-${{ needs.metadata.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  download-tensorrt:
    name: Download TensorRT-RTX SDK
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_tensorrt == true }}
    needs: metadata
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install container tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends --yes ca-certificates curl file git tar unzip zstd

      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download and verify TensorRT-RTX archive
        env:
          TENSORRT_RTX_URL: ${{ inputs.tensorrt_url || vars.TENSORRT_RTX_DOWNLOAD_URL }}
          TENSORRT_RTX_SHA256: ${{ inputs.tensorrt_sha256 || vars.TENSORRT_RTX_DOWNLOAD_SHA256 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          bash scripts/download-tensorrt-rtx.sh

      - name: Upload TensorRT-RTX SDK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tensorrt-rtx-sdk-${{ needs.metadata.outputs.tag }}
          path: tensorrt-sdk
          if-no-files-found: error
          retention-days: 1

  package-tensorrt:
    name: Windows TensorRt package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_tensorrt == true }}
    needs: [metadata, download-tensorrt]
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install CUDA toolkit
        shell: pwsh
        run: pwsh -NoProfile -File scripts/setup-cuda-ci.ps1

      - name: Download TensorRT-RTX SDK artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: tensorrt-rtx-sdk-${{ needs.metadata.outputs.tag }}
          path: ${{ runner.temp }}/tensorrt-rtx-sdk

      - name: Set up frontend dependencies
        working-directory: apps/tauri
        run: npm ci

      - name: Verify downloaded TensorRT and CUDA SDKs
        shell: pwsh
        env:
          TRT_ROOT: ${{ runner.temp }}/tensorrt-rtx-sdk
        run: |
          if (-not (Test-Path (Join-Path $env:TRT_ROOT "bin/tensorrt_rtx_1_6.dll"))) { throw "Downloaded TensorRT-RTX runtime DLL is missing" }
          if (-not (Test-Path (Join-Path $env:TRT_ROOT "include/NvInfer.h"))) { throw "Downloaded TensorRT-RTX headers are missing" }
          if (-not $env:CUDA_PATH) { throw "CUDA action did not set CUDA_PATH" }

      - name: Verify tag and manifest version
        shell: pwsh
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          $version = $env:TAG.Substring(1)
          python scripts/release-version.py verify --expected $version

      - name: Build Windows TensorRT-RTX release
        shell: pwsh
        env:
          CARGO_TERM_COLOR: always
          TENSORRT_RTX_ROOT: ${{ runner.temp }}/tensorrt-rtx-sdk
        run: |
          $target = Join-Path $env:RUNNER_TEMP "vocal-fast-TensorRt"
          pwsh -NoProfile -File scripts/build-windows.ps1 `
            -Profile Release `
            -Backend TensorRt `
            -TargetDirectory $target

      - name: Collect TensorRT installer and build manifest
        shell: pwsh
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          $target = Join-Path $env:RUNNER_TEMP "vocal-fast-TensorRt"
          $destination = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $installer = Get-ChildItem (Join-Path $target "release/bundle/nsis") -Filter "*-setup.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS TensorRT installer was not produced" }
          Copy-Item $installer.FullName (Join-Path $destination "vocal-fast-$env:TAG-TensorRt-setup.exe")
          Copy-Item (Join-Path $target "windows-build/Release-TensorRt/artifacts.json") (Join-Path $destination "vocal-fast-$env:TAG-TensorRt-artifacts.json")

      - name: Upload TensorRT package artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-TensorRt-${{ needs.metadata.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: ${{ always() && (github.event_name == 'push' || inputs.publish == true) && needs.metadata.result == 'success' && needs.package.result == 'success' && (needs['package-tensorrt'].result == 'success' || (needs['package-tensorrt'].result == 'skipped' && !(github.event_name == 'workflow_dispatch' && inputs.include_tensorrt == true))) }}
    needs: [metadata, package, package-tensorrt]
    runs-on: ubuntu-latest
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: windows-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-assets/*
