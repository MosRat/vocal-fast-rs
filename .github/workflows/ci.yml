name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check repository whitespace
        run: git diff --check
      - name: Check core workspace
        run: cargo check --workspace --exclude vocal-cpu --exclude vocal-tensorrt --locked
      - name: Test core workspace
        run: cargo test --workspace --exclude vocal-cpu --exclude vocal-tensorrt --locked

  python-tools:
    name: Python tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python -m compileall -q scripts

  tauri-frontend:
    name: Tauri frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
